{% extends "base.html" %}

{% block title %}Sign in · Pharma Intel{% endblock %}

{% block content %}
  <div class="card">
    <h1>Sign in</h1>
    {% if form.errors %}<p class="errorlist">Email or password is incorrect.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_div }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <p><button type="submit">Sign in</button></p>
    </form>
  </div>
{% endblock %}
